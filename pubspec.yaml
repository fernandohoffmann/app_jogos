name: game_backlog
description: Aplicativo para organizar o backlog de jogos, com persistência local usando shared_preferences.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Biblioteca externa (pub.dev) usada neste app:
  # shared_preferences - armazenamento local simples de dados no dispositivo
  # https://pub.dev/packages/shared_preferences
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
